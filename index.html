<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#17130d">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Smart Vintage Display</title>
  <style>
    :root{
      --cream:#f1dfb7; --dim:#b8a681; --dark:#17130d; --panel:#211b12;
      --glow:rgba(241,223,183,.22); --brightness:1;
    }
    *{box-sizing:border-box}
    html,body{width:100%;height:100%;margin:0;background:#0c0a07;color:var(--cream);overflow:hidden;overscroll-behavior:none}
    button{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
    body{min-height:100vh;min-height:100dvh}
    body{
      font-family:Georgia,"Times New Roman",serif;
      display:grid;place-items:center;
      filter:brightness(var(--brightness));
      transition:filter .4s ease;
    }
    .tv{
      position:relative;width:100vw;height:var(--app-height,100vh);min-height:100svh;overflow:hidden;
      background:
        radial-gradient(ellipse at center,rgba(76,61,35,.18),transparent 58%),
        linear-gradient(180deg,#1d180f 0%,#11100b 100%);
      padding:max(18px,3vw);padding-left:max(18px,env(safe-area-inset-left));padding-right:max(18px,env(safe-area-inset-right));padding-top:max(18px,env(safe-area-inset-top));padding-bottom:max(18px,env(safe-area-inset-bottom));
      display:flex;flex-direction:column;justify-content:space-between;
    }
    .tv::before{
      content:"";position:absolute;inset:0;pointer-events:none;opacity:.18;
      background:repeating-linear-gradient(0deg,rgba(255,255,255,.055) 0 1px,transparent 1px 4px);
      mix-blend-mode:screen;
    }
    .tv::after{
      content:"";position:absolute;inset:-20%;pointer-events:none;
      background:radial-gradient(ellipse at center,transparent 45%,rgba(0,0,0,.55) 78%);
    }
    .topbar,.footer{position:relative;z-index:2;display:flex;align-items:center;justify-content:space-between;gap:16px;color:var(--dim);letter-spacing:.13em;text-transform:uppercase;font-size:clamp(11px,1.7vw,16px)}
    .status{display:flex;align-items:center;gap:8px}
    .dot{width:8px;height:8px;border-radius:50%;background:#6c624e;box-shadow:0 0 8px rgba(255,255,255,.1)}
    .dot.online{background:#d7c391;box-shadow:0 0 12px rgba(215,195,145,.65)}
    .screen{position:relative;z-index:2;flex:1;display:grid;place-items:center;min-height:0}
    .page{width:min(100%,1100px);display:none;text-align:center;animation:fade .8s ease}
    .page.active{display:block}
    @keyframes fade{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
    .eyebrow{font-size:clamp(12px,2vw,19px);letter-spacing:.28em;text-transform:uppercase;color:var(--dim);margin-bottom:18px}
    .clock{font-size:clamp(62px,17vw,190px);line-height:.88;letter-spacing:-.055em;text-shadow:0 0 24px var(--glow);font-variant-numeric:tabular-nums}
    .ampm{font-size:.22em;letter-spacing:.08em;margin-left:.12em;color:var(--dim)}
    .date{font-size:clamp(18px,3vw,32px);margin-top:18px;color:var(--dim)}
    .message{font-size:clamp(25px,5.6vw,64px);line-height:1.08;max-width:950px;margin:34px auto 0;text-wrap:balance;text-shadow:0 0 18px rgba(241,223,183,.11)}
    .submessage{font-size:clamp(14px,2.2vw,22px);color:var(--dim);margin:18px auto 0;max-width:850px;line-height:1.45}
    .weather-temp{font-size:clamp(76px,18vw,190px);line-height:.9}
    .weather-desc{font-size:clamp(24px,5vw,56px);margin-top:20px}
    .weather-grid{margin:35px auto 0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;max-width:800px}
    .card{border:1px solid rgba(241,223,183,.2);background:rgba(255,255,255,.025);padding:18px 12px;border-radius:12px}
    .card span{display:block;color:var(--dim);font-size:clamp(10px,1.6vw,14px);letter-spacing:.15em;text-transform:uppercase;margin-bottom:6px}
    .card strong{font-size:clamp(18px,3vw,28px);font-weight:normal}
    .event-title{font-size:clamp(34px,7vw,80px);line-height:1.05;text-wrap:balance}
    .event-time{font-size:clamp(18px,3.2vw,34px);color:var(--dim);margin-top:20px}
    .empty{font-size:clamp(25px,5vw,55px);color:var(--dim)}
    .video-page{position:absolute;inset:0;width:100%;max-width:none;height:100%;overflow:hidden}
    .video-page.active{display:block}
    .video-page video{width:100%;height:100%;object-fit:cover;background:#090806;filter:sepia(.16) saturate(.88) contrast(.96) brightness(.96)}
    .video-page video.vintage-frame{object-fit:contain}
    .video-page img{width:100%;height:100%;object-fit:cover;background:#090806;animation:livingPostcard 35s ease-in-out infinite alternate}
    .video-page::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 52%,rgba(0,0,0,.5) 100%)}
    .seasonal-effects{position:absolute;z-index:1;inset:0;overflow:hidden;pointer-events:none}
    .water-shimmer{position:absolute;left:42%;right:-5%;top:59%;bottom:5%;opacity:.18;mix-blend-mode:screen;background:repeating-linear-gradient(178deg,transparent 0 7px,rgba(255,222,143,.75) 8px 9px,transparent 10px 16px);mask-image:radial-gradient(ellipse at 58% 40%,#000 0 18%,transparent 68%);animation:waterShimmer 5.5s ease-in-out infinite alternate}
    .film-breathe{position:absolute;inset:0;background:linear-gradient(115deg,rgba(255,196,96,.045),transparent 38%,rgba(89,52,17,.035));mix-blend-mode:soft-light;animation:filmBreathe 7s ease-in-out infinite alternate}
    .leaf-particle{position:absolute;top:-14%;left:var(--x);width:var(--size);height:var(--height);border-radius:90% 0 90% 0;background:var(--leaf);opacity:var(--opacity);filter:drop-shadow(0 2px 1px rgba(45,25,9,.2));animation:leafFall var(--duration) linear var(--delay) infinite}
    .leaf-particle::after{content:"";position:absolute;left:47%;top:4%;width:1px;height:92%;background:rgba(70,35,10,.42);transform:rotate(-38deg);transform-origin:center}
    .video-label{position:absolute;z-index:2;left:22px;bottom:18px;padding:8px 11px;border:1px solid rgba(241,223,183,.25);border-radius:999px;background:rgba(12,10,7,.58);color:var(--dim);font-size:11px;letter-spacing:.15em;text-transform:uppercase;backdrop-filter:blur(5px)}
    .video-empty{height:100%;display:grid;place-items:center;padding:30px;color:var(--dim);font-size:clamp(22px,4vw,46px);background:radial-gradient(circle at 35% 35%,#654d31,transparent 32%),radial-gradient(circle at 68% 62%,#263d3a,transparent 35%),#17130d}
    @keyframes livingPostcard{from{transform:scale(1.01) translate3d(-.3%,0,0)}to{transform:scale(1.07) translate3d(.7%,-.5%,0)}}
    @keyframes waterShimmer{from{transform:translate3d(-1.2%,0,0) scaleY(.96);opacity:.11}to{transform:translate3d(1.2%,1%,0) scaleY(1.04);opacity:.24}}
    @keyframes filmBreathe{from{opacity:.45}to{opacity:1}}
    @keyframes leafFall{0%{transform:translate3d(0,-8vh,0) rotate(0deg)}35%{transform:translate3d(var(--sway),38vh,0) rotate(220deg)}70%{transform:translate3d(var(--sway-back),82vh,0) rotate(480deg)}100%{transform:translate3d(var(--drift),122vh,0) rotate(720deg)}}
    @media(prefers-reduced-motion:reduce){.video-page img,.water-shimmer,.film-breathe,.leaf-particle{animation:none}}
    .control-toggle{
      position:absolute;z-index:30;right:max(14px,env(safe-area-inset-right));bottom:max(14px,env(safe-area-inset-bottom));
      width:54px;height:54px;border:1px solid rgba(241,223,183,.38);border-radius:50%;
      background:rgba(15,13,9,.86);color:var(--cream);font:inherit;font-size:24px;line-height:1;
      display:grid;place-items:center;box-shadow:0 6px 24px rgba(0,0,0,.35);backdrop-filter:blur(8px);cursor:pointer
    }
    .control-panel{
      position:absolute;z-index:29;right:max(14px,env(safe-area-inset-right));bottom:max(78px,calc(env(safe-area-inset-bottom) + 78px));
      width:min(360px,calc(100vw - 28px));padding:12px;border:1px solid rgba(241,223,183,.28);border-radius:16px;
      background:rgba(12,10,7,.94);box-shadow:0 14px 45px rgba(0,0,0,.46);backdrop-filter:blur(12px);
      opacity:0;transform:translateY(8px) scale(.98);pointer-events:none;transition:opacity .18s ease,transform .18s ease
    }
    .control-panel.open{opacity:1;transform:none;pointer-events:auto}
    .control-title{display:flex;align-items:center;justify-content:space-between;color:var(--dim);font-size:11px;letter-spacing:.16em;text-transform:uppercase;padding:2px 2px 10px}
    .control-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
    .control-btn{
      min-height:52px;border:1px solid rgba(241,223,183,.2);border-radius:11px;background:rgba(255,255,255,.035);color:var(--cream);
      font:inherit;font-size:14px;letter-spacing:.04em;padding:10px;cursor:pointer
    }
    .control-btn:active{transform:scale(.98);background:rgba(241,223,183,.12)}
    .control-btn.wide{grid-column:1/-1}
    .hidden{display:none!important}
    .burn-shift{transition:transform 1.2s ease}
    body.quiet-mode .topbar,body.quiet-mode .footer{opacity:.38;transition:opacity 1.2s ease}
    body.quiet-mode .control-toggle{opacity:.7}
    @media(orientation:landscape) and (max-height:900px){
      .tv{padding:16px 24px}
      .topbar,.footer{font-size:clamp(10px,1.3vw,14px)}
      .eyebrow{font-size:clamp(11px,1.5vw,16px);margin-bottom:10px}
      .clock{font-size:clamp(64px,14vw,150px)}
      .date{font-size:clamp(16px,2.3vw,26px);margin-top:10px}
      .message{font-size:clamp(22px,4vw,48px);margin-top:18px}
      .submessage{font-size:clamp(13px,1.8vw,19px);margin-top:10px}
      .weather-temp{font-size:clamp(72px,14vw,150px)}
      .weather-desc{font-size:clamp(22px,3.8vw,46px);margin-top:10px}
      .weather-grid{margin-top:18px;gap:10px}
      .card{padding:12px 10px}
      .event-title{font-size:clamp(32px,5.3vw,66px)}
      .event-time{font-size:clamp(17px,2.6vw,28px);margin-top:12px}
    }
    @media(max-width:650px){
      .tv{padding:16px}
      .weather-grid{grid-template-columns:repeat(3,1fr)}
      .footer{font-size:10px}
    }
  </style>
  <script src="config.js"></script>
</head>
<body>
  <main class="tv" id="tv">
    <header class="topbar">
      <div id="displayName">HOME TV</div>
      <div class="status"><span class="dot" id="syncDot"></span><span id="syncLabel">LOCAL</span></div>
    </header>

    <section class="screen burn-shift" id="screen">
      <div class="page active" data-page="home">
        <div class="eyebrow" id="daypart">Good morning</div>
        <div class="clock"><span id="clock">--:--</span><span class="ampm" id="ampm"></span></div>
        <div class="date" id="date"></div>
        <div class="message" id="mainMessage"></div>
        <div class="submessage" id="contextMessage"></div>
      </div>

      <div class="page" data-page="weather">
        <div class="eyebrow" id="weatherLocation">Weather</div>
        <div class="weather-temp" id="weatherTemp">--°</div>
        <div class="weather-desc" id="weatherDesc">Updating weather…</div>
        <div class="weather-grid">
          <div class="card"><span>Feels like</span><strong id="feelsLike">--°</strong></div>
          <div class="card"><span>Today</span><strong id="hiLow">-- / --</strong></div>
          <div class="card"><span>Rain</span><strong id="rainChance">--%</strong></div>
        </div>
      </div>

      <div class="page" data-page="calendar">
        <div class="eyebrow">Up next</div>
        <div id="eventWrap">
          <div class="event-title" id="eventTitle">No upcoming events</div>
          <div class="event-time" id="eventTime"></div>
        </div>
      </div>

      <div class="page video-page" data-page="video">
        <video id="screensaverVideo" muted playsinline preload="metadata"></video>
        <img id="screensaverImage" class="hidden" alt="Seasonal vintage screensaver">
        <div class="seasonal-effects hidden" id="seasonalEffects" aria-hidden="true">
          <div class="water-shimmer"></div>
          <div class="film-breathe"></div>
          <div id="leafLayer"></div>
        </div>
        <div class="video-empty" id="videoEmpty">Add seasonal artwork or video clips in config.js</div>
        <div class="video-label" id="videoLabel">Video screensaver</div>
      </div>
    </section>

    <footer class="footer">
      <div id="footerLeft">Smart Display v2</div>
      <div id="footerRight">AUTO</div>
    </footer>

    <button class="control-toggle" id="controlToggle" aria-label="Open display controls" aria-expanded="false">☰</button>
    <div class="control-panel" id="controlPanel" role="dialog" aria-label="Display controls">
      <div class="control-title"><span>Display controls</span><span id="controlStatus">AUTO</span></div>
      <div class="control-grid">
        <button class="control-btn" data-go="home">Home</button>
        <button class="control-btn" data-go="weather">Weather</button>
        <button class="control-btn" data-go="calendar">Calendar</button>
        <button class="control-btn" data-go="video">Scene</button>
        <button class="control-btn" id="soundButton">Enable sound</button>
        <button class="control-btn" id="fullscreenButton">Fullscreen</button>
        <button class="control-btn wide" id="nextButton">Next screen</button>
      </div>
    </div>
    <audio id="jazzPlayer" preload="metadata"></audio>
  </main>

<script type="module">
const CFG = window.SMART_DISPLAY_CONFIG || {};
const $ = (id) => document.getElementById(id);
const pages = [...document.querySelectorAll(".page")];

const state = {
  page: "home",
  weather: null,
  events: [],
  rotationIndex: 0,
  videoIndex: 0,
  videoPlaylist: [],
  // Browsers require a fresh user gesture after a page load before music/chimes can reliably play.
  soundUnlocked: false,
  lastChimeKey: "",
  quietMode: null,
  musicIndex: 0,
  musicPlaylist: [],
  imageAdvanceTimer: null
};

const quotes = [
  "Small steps, repeated daily, become big changes.",
  "Make today useful.",
  "You do not need perfect conditions to make progress.",
  "A calm start can still lead to a powerful day.",
  "Focus on what moves the day forward.",
  "Consistency beats intensity when intensity cannot last.",
  "Do one thing today that tomorrow will thank you for.",
  "Keep the goal visible and the next step simple.",
  "You can reset the day at any hour.",
  "Progress counts even when it looks ordinary.",
  "Protect your energy. Spend it on what matters.",
  "Finish strong, then let the day go."
];

function nowInZone(){
  // Date itself remains absolute; formatting uses the configured timezone.
  return new Date();
}
function partsInZone(date = new Date()){
  const parts = new Intl.DateTimeFormat("en-US",{
    timeZone: CFG.timezone || "America/New_York",
    hour:"numeric",minute:"2-digit",second:"2-digit",hour12:true,
    weekday:"long",month:"long",day:"numeric",year:"numeric"
  }).formatToParts(date);
  return Object.fromEntries(parts.map(p=>[p.type,p.value]));
}
function hourInZone(date = new Date()){
  return Number(new Intl.DateTimeFormat("en-US",{
    timeZone: CFG.timezone || "America/New_York", hour:"2-digit",hourCycle:"h23"
  }).format(date));
}
function formatTime(date){
  return new Intl.DateTimeFormat("en-US",{
    timeZone: CFG.timezone || "America/New_York", hour:"numeric",minute:"2-digit"
  }).format(date);
}
function formatDate(date){
  return new Intl.DateTimeFormat("en-US",{
    timeZone: CFG.timezone || "America/New_York",weekday:"long",month:"long",day:"numeric"
  }).format(date);
}
function dayKey(date = new Date()){
  return new Intl.DateTimeFormat("en-CA",{
    timeZone: CFG.timezone || "America/New_York",year:"numeric",month:"2-digit",day:"2-digit"
  }).format(date);
}
function quoteForToday(){
  const key = dayKey().replace(/\D/g,"");
  const n = [...key].reduce((a,b)=>a+Number(b),0);
  return quotes[n % quotes.length];
}
function daypartInfo(hour){
  if(hour < 5) return {label:"Late night", msg:"Sleep tight.", sub:"The rest can wait until morning."};
  if(hour < 12) return {label:"Good morning", msg:"A new day is here.", sub:quoteForToday()};
  if(hour < 17) return {label:"Good afternoon", msg:"Keep the momentum going.", sub:quoteForToday()};
  if(hour < 21) return {label:"Good evening", msg:"Ease into the evening.", sub:"Wrap up what matters. Let the rest wait."};
  return {label:"Wind down", msg:"The day is almost done.", sub:"Slow things down. Tomorrow gets a fresh start."};
}
function showPage(name){
  const pageChanged = name !== state.page;
  if(!pageChanged) return;
  const wasScreensaver = state.page === "video";
  state.page = name;
  pages.forEach(p=>p.classList.toggle("active",p.dataset.page===name));
  const nightMode = CFG.quietDisplay?.enabled !== false && isQuietHour(hourInZone());
  $("footerRight").textContent = nightMode ? "NIGHT MODE" : name === "video" ? "SCREENSAVER" : "AUTO";
  if($("controlStatus")) $("controlStatus").textContent = nightMode ? "NIGHT" : name.toUpperCase();
  if(name === "video") playScreensaver();
  else{
    clearTimeout(state.imageAdvanceTimer);
    state.imageAdvanceTimer = null;
    $("screensaverVideo").pause();
    if(wasScreensaver && state.videoPlaylist.length > 1){
      state.videoIndex = (state.videoIndex + 1) % state.videoPlaylist.length;
    }
  }
}
function updateClock(){
  const p = partsInZone();
  $("clock").textContent = `${p.hour}:${p.minute}`;
  $("ampm").textContent = p.dayPeriod || "";
  $("date").textContent = `${p.weekday}, ${p.month} ${p.day}`;
  const info = daypartInfo(hourInZone());
  $("daypart").textContent = info.label;
  $("mainMessage").textContent = info.msg;
  $("contextMessage").textContent = smartContext(info.sub);
  applyDayNightMode();
  maybeChime();
}
function smartContext(fallback){
  const w = state.weather;
  if(!w) return fallback;
  if(w.precipProb >= 60) return `Rain is likely today — an umbrella may be worth grabbing.`;
  if(w.temp <= 35) return `It is cold outside — bundle up before heading out.`;
  if(w.temp >= 88) return `It is a hot one — keep water nearby.`;
  if(w.code === 0 && hourInZone() < 17) return `Clear skies today. ${fallback}`;
  return fallback;
}
const WMO = {
  0:["Clear","☀"],1:["Mostly clear","🌤"],2:["Partly cloudy","⛅"],3:["Overcast","☁"],
  45:["Fog","🌫"],48:["Rime fog","🌫"],51:["Light drizzle","🌦"],53:["Drizzle","🌦"],55:["Heavy drizzle","🌧"],
  61:["Light rain","🌧"],63:["Rain","🌧"],65:["Heavy rain","🌧"],71:["Light snow","🌨"],73:["Snow","🌨"],
  75:["Heavy snow","❄"],77:["Snow grains","❄"],80:["Rain showers","🌦"],81:["Rain showers","🌧"],
  82:["Heavy showers","⛈"],85:["Snow showers","🌨"],86:["Heavy snow showers","❄"],95:["Thunderstorm","⛈"],
  96:["Thunderstorm + hail","⛈"],99:["Thunderstorm + hail","⛈"]
};
async function fetchWeather(){
  if(!CFG.weather?.enabled) return;
  const w = CFG.weather;
  const params = new URLSearchParams({
    latitude:w.latitude, longitude:w.longitude,
    current:"temperature_2m,apparent_temperature,weather_code,is_day",
    daily:"weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,sunrise,sunset",
    temperature_unit:w.temperatureUnit || "fahrenheit",
    timezone:CFG.timezone || "auto",
    forecast_days:"3"
  });
  try{
    const r = await fetch(`https://api.open-meteo.com/v1/forecast?${params}`);
    if(!r.ok) throw new Error(`Weather HTTP ${r.status}`);
    const data = await r.json();
    state.weather = {
      temp:Math.round(data.current.temperature_2m),
      feels:Math.round(data.current.apparent_temperature),
      code:data.current.weather_code,
      hi:Math.round(data.daily.temperature_2m_max[0]),
      lo:Math.round(data.daily.temperature_2m_min[0]),
      precipProb:Math.round(data.daily.precipitation_probability_max[0] ?? 0),
      cachedAt:Date.now()
    };
    try{ localStorage.setItem("smartDisplayWeather",JSON.stringify(state.weather)); }catch{}
    renderWeather();
    $("footerLeft").textContent = `Weather updated ${formatTime(new Date())}`;
  }catch(e){
    console.warn(e);
    if(state.weather){
      renderWeather();
      $("footerLeft").textContent = "Using cached weather";
    }else{
      $("weatherDesc").textContent = "Weather unavailable";
    }
  }
}
function renderWeather(){
  const w = state.weather;if(!w) return;
  const [label,icon] = WMO[w.code] || ["Current conditions",""];
  $("weatherLocation").textContent = CFG.weather?.locationName || "Weather";
  $("weatherTemp").textContent = `${w.temp}°`;
  $("weatherDesc").textContent = `${icon} ${label}`.trim();
  $("feelsLike").textContent = `${w.feels}°`;
  $("hiLow").textContent = `${w.hi}° / ${w.lo}°`;
  $("rainChance").textContent = `${w.precipProb}%`;
}
async function fetchCalendar(){
  if(!CFG.calendar?.enabled) return;
  let events = [];
  try{
    if(CFG.calendar.source === "google-public" && CFG.calendar.googleCalendarId && CFG.calendar.googleCalendarApiKey){
      const now = new Date().toISOString();
      const url = `https://www.googleapis.com/calendar/v3/calendars/${encodeURIComponent(CFG.calendar.googleCalendarId)}/events?singleEvents=true&orderBy=startTime&maxResults=10&timeMin=${encodeURIComponent(now)}&key=${encodeURIComponent(CFG.calendar.googleCalendarApiKey)}`;
      const r = await fetch(url);
      if(!r.ok) throw new Error(`Calendar HTTP ${r.status}`);
      const data = await r.json();
      events = (data.items || []).map(e=>({
        title:e.summary || "Untitled event",
        start:e.start?.dateTime || e.start?.date
      }));
    }else{
      events = Array.isArray(CFG.calendar.events) ? CFG.calendar.events : [];
    }
    state.events = events
      .filter(e=>e.start && new Date(e.start).getTime() >= Date.now()-3600000)
      .sort((a,b)=>new Date(a.start)-new Date(b.start));
    renderCalendar();
  }catch(e){
    console.warn(e);
    $("eventTitle").textContent = "Calendar unavailable";
    $("eventTime").textContent = "";
  }
}
function renderCalendar(){
  const event = state.events[0];
  if(!event){
    $("eventTitle").textContent = "Nothing scheduled";
    $("eventTime").textContent = "Your next event will appear here.";
    return;
  }
  $("eventTitle").textContent = event.title;
  if(event.start){
    const d = new Date(event.start);
    $("eventTime").textContent = `${formatDate(d)} · ${formatTime(d)}`;
  }else{
    $("eventTime").textContent = event.detail || "";
  }
}
function choosePage(force=false){
  if(CFG.quietDisplay?.enabled !== false && isQuietHour(hourInZone())){
    return showPage(CFG.quietDisplay?.screen || "video");
  }
  let screens = CFG.rotation?.enabled ? (CFG.rotation.screens || ["home"]) : ["home"];
  if(!CFG.screensaver?.enabled) screens = screens.filter(name=>name!=="video");
  if(force || !screens.includes(state.page)) state.rotationIndex = 0;
  else state.rotationIndex = (state.rotationIndex + 1) % screens.length;
  showPage(screens[state.rotationIndex] || "home");
}
function isQuietHour(hour){
  const s = Number(CFG.sound?.quietStartHour ?? 23);
  const e = Number(CFG.sound?.quietEndHour ?? 7);
  if(s === e) return false;
  return s < e ? hour >= s && hour < e : hour >= s || hour < e;
}
function audioEnabled(){
  return state.soundUnlocked;
}
function buildMusicPlaylist(){
  state.musicPlaylist = [...(CFG.daytimeMusic?.tracks || [])].filter(Boolean);
  if(CFG.daytimeMusic?.shuffle){
    for(let i=state.musicPlaylist.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      [state.musicPlaylist[i],state.musicPlaylist[j]] = [state.musicPlaylist[j],state.musicPlaylist[i]];
    }
  }
}
function reconcileMusic(){
  const player = $("jazzPlayer");
  const shouldPlay = CFG.daytimeMusic?.enabled && audioEnabled() && !isQuietHour(hourInZone()) && state.musicPlaylist.length;
  if(!shouldPlay){
    player.pause();
    return;
  }
  player.volume = Math.max(0,Math.min(1,Number(CFG.daytimeMusic?.volume ?? .18)));
  const source = state.musicPlaylist[state.musicIndex % state.musicPlaylist.length];
  if(player.dataset.source !== source){
    player.dataset.source = source;
    player.src = source;
  }
  if(player.paused && !player.dataset.blocked){
    player.dataset.blocked = "pending";
    player.play().then(()=>{ delete player.dataset.blocked; }).catch(()=>{
      player.dataset.blocked = "true";
      $("soundButton").textContent = "Tap to retry sound";
    });
  }
}
function applyDayNightMode(){
  const quiet = CFG.quietDisplay?.enabled !== false && isQuietHour(hourInZone());
  document.body.classList.toggle("quiet-mode",quiet);
  document.documentElement.style.setProperty("--brightness",String(quiet ? Math.max(.15,Math.min(1,Number(CFG.quietDisplay?.brightness ?? .42))) : 1));
  if(state.quietMode !== quiet){
    state.quietMode = quiet;
    if(quiet) showPage(CFG.quietDisplay?.screen || "video");
    else choosePage(true);
  }
  reconcileMusic();
}
$("jazzPlayer").addEventListener("ended",()=>{
  if(!state.musicPlaylist.length) return;
  state.musicIndex = (state.musicIndex + 1) % state.musicPlaylist.length;
  $("jazzPlayer").dataset.source = "";
  reconcileMusic();
});
function tone(freq=740,duration=.16,volume=.05){
  if(!audioEnabled() || isQuietHour(hourInZone())) return;
  const Ctx = window.AudioContext || window.webkitAudioContext;
  if(!Ctx) return;
  const ctx = window.__smartAudio || (window.__smartAudio = new Ctx());
  const osc=ctx.createOscillator(), gain=ctx.createGain();
  osc.type="sine";osc.frequency.value=freq;
  gain.gain.setValueAtTime(volume,ctx.currentTime);
  gain.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+duration);
  osc.connect(gain);gain.connect(ctx.destination);
  osc.start();osc.stop(ctx.currentTime+duration);
}
function chime(kind="soft"){
  if(kind==="morning"){
    tone(523,.18,.03);setTimeout(()=>tone(659,.18,.03),180);setTimeout(()=>tone(784,.28,.03),360);
  }else if(kind==="evening"){
    tone(784,.18,.025);setTimeout(()=>tone(659,.18,.025),180);setTimeout(()=>tone(523,.3,.025),360);
  }else if(kind==="hourly"){
    tone(660,.18,.035);setTimeout(()=>tone(880,.22,.03),180);
  }else{
    tone(780,.24,.035);
  }
}
function maybeChime(){
  if(!CFG.sound?.hourlyChime || !audioEnabled()) return;
  const p=partsInZone(), hour=hourInZone();
  if(isQuietHour(hour)) return;
  const key=`${dayKey()}-${hour}`;
  if(p.minute==="00" && key!==state.lastChimeKey){
    state.lastChimeKey=key;
    if(hour === Number(CFG.sound?.morningChimeHour ?? 8)) chime("morning");
    else if(hour === Number(CFG.sound?.eveningChimeHour ?? 19)) chime("evening");
    else chime("hourly");
  }
}
function updateSoundButton(){
  $("soundButton").textContent = state.soundUnlocked ? "Sound on" : "Enable sound";
}
$("soundButton").addEventListener("click",()=>{
  state.soundUnlocked = $("jazzPlayer").dataset.blocked === "true" ? true : !state.soundUnlocked;
  delete $("jazzPlayer").dataset.blocked;
  updateSoundButton();
  reconcileMusic();
});
updateSoundButton();

const controlPanel = $("controlPanel");
const controlToggle = $("controlToggle");
function setControlsOpen(open){
  controlPanel.classList.toggle("open",open);
  controlToggle.setAttribute("aria-expanded",open ? "true" : "false");
  controlToggle.textContent = open ? "×" : "☰";
}
controlToggle.addEventListener("click",e=>{
  e.stopPropagation();
  setControlsOpen(!controlPanel.classList.contains("open"));
});
controlPanel.addEventListener("click",e=>e.stopPropagation());
document.addEventListener("pointerdown",e=>{
  if(controlPanel.classList.contains("open") && !controlPanel.contains(e.target) && e.target!==controlToggle) setControlsOpen(false);
});

document.querySelectorAll("[data-go]").forEach(btn=>btn.addEventListener("click",()=>{
  const name=btn.dataset.go;
  const screens=CFG.rotation?.screens || ["home","weather","calendar","video"];
  const idx=screens.indexOf(name);
  if(idx>=0) state.rotationIndex=idx;
  showPage(name);
  $("controlStatus").textContent=name.toUpperCase();
  setControlsOpen(false);
}));
$("nextButton").addEventListener("click",()=>{
  choosePage(false);
  $("controlStatus").textContent=state.page.toUpperCase();
  setControlsOpen(false);
});

function fullscreenActive(){
  return !!(document.fullscreenElement || document.webkitFullscreenElement);
}
function updateFullscreenButton(){
  $("fullscreenButton").textContent = fullscreenActive() ? "Exit fullscreen" : "Fullscreen";
}
async function toggleFullscreen(){
  try{
    if(fullscreenActive()){
      const exit=document.exitFullscreen || document.webkitExitFullscreen;
      if(exit) await exit.call(document);
    }else{
      const root=document.documentElement;
      const request=root.requestFullscreen || root.webkitRequestFullscreen;
      if(request) await request.call(root);
      try{ await screen.orientation?.lock?.("landscape"); }catch{}
    }
  }catch(e){ console.warn("Fullscreen request was blocked",e); }
  updateFullscreenButton();
  setViewportHeight();
}
$("fullscreenButton").addEventListener("click",toggleFullscreen);
document.addEventListener("fullscreenchange",updateFullscreenButton);
document.addEventListener("webkitfullscreenchange",updateFullscreenButton);

function setViewportHeight(){
  document.documentElement.style.setProperty("--app-height",`${window.innerHeight}px`);
}
setViewportHeight();
window.addEventListener("resize",setViewportHeight);
window.addEventListener("orientationchange",()=>setTimeout(setViewportHeight,150));
updateFullscreenButton();

function buildVideoPlaylist(){
  const sets = CFG.screensaver?.playlists || {};
  const collection = CFG.screensaver?.collection || "mix";
  if(collection === "seasonal"){
    const month = Number(new Intl.DateTimeFormat("en-US",{timeZone:CFG.timezone || "America/New_York",month:"numeric"}).format(new Date()));
    const automaticSeason = month >= 9 && month <= 11 ? "fall" : month === 12 || month <= 2 ? "winter" : month <= 5 ? "spring" : "summer";
    const season = CFG.screensaver?.season === "auto" || !CFG.screensaver?.season ? automaticSeason : CFG.screensaver.season;
    state.videoPlaylist = [...(CFG.screensaver?.seasonal?.[season] || [])];
    if(!state.videoPlaylist.length) state.videoPlaylist = [...(CFG.screensaver?.seasonal?.fall || [])];
    $("videoLabel").textContent = `${season} · living postcard`;
  }else{
    state.videoPlaylist = collection === "mix"
      ? [...(sets.vintage || []), ...(sets.games || [])]
      : [...(sets[collection] || [])];
    $("videoLabel").textContent = collection === "mix" ? "Vintage + games" : collection;
  }
  state.videoPlaylist = state.videoPlaylist.filter(Boolean);
  $("videoLabel").classList.toggle("hidden",CFG.screensaver?.showLabel === false);
}
function buildSeasonalEffects(){
  const layer = $("leafLayer");
  const colors = ["#c85b22","#e08a24","#a83f20","#d6a02d","#7d5425"];
  for(let i=0;i<14;i++){
    const leaf = document.createElement("i");
    leaf.className = "leaf-particle";
    leaf.style.setProperty("--x",`${(i * 37 + 11) % 101}%`);
    const size = 8 + (i * 7) % 15;
    leaf.style.setProperty("--size",`${size}px`);
    leaf.style.setProperty("--height",`${Math.round(size * .72)}px`);
    leaf.style.setProperty("--duration",`${13 + (i * 5) % 12}s`);
    leaf.style.setProperty("--delay",`${-((i * 4.7) % 20)}s`);
    leaf.style.setProperty("--sway",`${-70 + (i * 31) % 145}px`);
    leaf.style.setProperty("--sway-back",`${55 - (i * 19) % 115}px`);
    leaf.style.setProperty("--drift",`${-45 + (i * 23) % 105}px`);
    leaf.style.setProperty("--opacity",String(.48 + (i % 4) * .12));
    leaf.style.setProperty("--leaf",colors[i % colors.length]);
    layer.appendChild(leaf);
  }
}
function playScreensaver(){
  if(state.page !== "video") return;
  const video = $("screensaverVideo");
  const image = $("screensaverImage");
  if(!state.videoPlaylist.length){
    video.classList.add("hidden");
    image.classList.add("hidden");
    $("seasonalEffects").classList.add("hidden");
    $("videoEmpty").classList.remove("hidden");
    return;
  }
  $("videoEmpty").classList.add("hidden");
  const source = state.videoPlaylist[state.videoIndex % state.videoPlaylist.length];
  if(/\.(png|jpe?g|webp|gif)(\?.*)?$/i.test(source)){
    video.pause();
    video.classList.add("hidden");
    image.src = source;
    image.style.animation = CFG.screensaver?.motionEffects === false ? "none" : "";
    image.classList.remove("hidden");
    $("seasonalEffects").classList.toggle("hidden",CFG.screensaver?.motionEffects === false);
    clearTimeout(state.imageAdvanceTimer);
    if(state.videoPlaylist.length > 1){
      state.imageAdvanceTimer = setTimeout(()=>{
        if(state.page !== "video") return;
        state.videoIndex = (state.videoIndex + 1) % state.videoPlaylist.length;
        playScreensaver();
      },(CFG.rotation?.secondsPerScreen || 35)*1000);
    }
    return;
  }
  clearTimeout(state.imageAdvanceTimer);
  state.imageAdvanceTimer = null;
  image.classList.add("hidden");
  $("seasonalEffects").classList.add("hidden");
  video.classList.remove("hidden");
  video.classList.toggle("vintage-frame",/fall-cartoon-/.test(source));
  video.muted = true;
  if(video.dataset.source !== source){
    video.dataset.source = source;
    video.src = source;
  }
  video.play().catch(()=>{});
}
$("screensaverVideo").addEventListener("ended",()=>{
  if(state.page !== "video") return;
  state.videoIndex = (state.videoIndex + 1) % Math.max(1,state.videoPlaylist.length);
  $("screensaverVideo").dataset.source = "";
  playScreensaver();
});
const failedMedia = new Set();
function skipBrokenMedia(){
  if(state.page !== "video") return;
  const source = state.videoPlaylist[state.videoIndex % state.videoPlaylist.length];
  failedMedia.add(source);
  clearTimeout(state.imageAdvanceTimer);
  if(state.videoPlaylist.every(item=>failedMedia.has(item))){
    $("screensaverVideo").pause();
    ["screensaverVideo","screensaverImage","seasonalEffects"].forEach(id=>$(id).classList.add("hidden"));
    $("videoEmpty").textContent = "Media unavailable — check the media folder.";
    $("videoEmpty").classList.remove("hidden");
    return;
  }
  do{ state.videoIndex = (state.videoIndex + 1) % state.videoPlaylist.length; }
  while(failedMedia.has(state.videoPlaylist[state.videoIndex]));
  playScreensaver();
}
$("screensaverImage").addEventListener("error",skipBrokenMedia);
$("screensaverVideo").addEventListener("error",skipBrokenMedia);
function burnInShift(){
  const x = Math.floor(Math.random()*5)-2;
  const y = Math.floor(Math.random()*5)-2;
  $("screen").style.transform=`translate(${x}px,${y}px)`;
}
$("displayName").textContent = CFG.displayName || "HOME TV";
try{
  const cached = JSON.parse(localStorage.getItem("smartDisplayWeather") || "null");
  if(cached && Date.now() - Number(cached.cachedAt || 0) < 6*60*60*1000){
    state.weather = cached;
    renderWeather();
  }
}catch{}
buildVideoPlaylist();
buildSeasonalEffects();
buildMusicPlaylist();
updateClock(); fetchWeather(); fetchCalendar();
setInterval(updateClock,1000);
setInterval(()=>choosePage(false),(CFG.rotation?.secondsPerScreen || 35)*1000);
setInterval(fetchWeather,(CFG.weather?.refreshMinutes || 20)*60000);
setInterval(fetchCalendar,(CFG.calendar?.refreshMinutes || 15)*60000);
setInterval(burnInShift,5*60000);
</script>
